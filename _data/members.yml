  themes: [immersive-training, health-tech-design, HCI]
  email: "carlos.tiradocortes@sydney.edu.au"
  scholar: https://scholar.google.com/citations?user=MrPRkhIAAAAJ

- name: Howe Yuan Zhu
  role: academic
  interests: Extended reality, human-robot interaction and human-AI interaction
  themes: [human-robot-interaction, human-ai-interaction]
  website: https://profiles.sydney.edu.au/howe.zhu

- name: Yulin Zeng
  role: masters
  title: Masters Capstone Student
  interests: Older migrants and online health information seeking
  themes: [patient-solutions, HCI, human-robot-interaction, human-ai-interaction]

- name: Jolene Galloway
