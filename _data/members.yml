# HII Lab members.
#
# To add someone: copy a block, fill it in, drop their photo into
# assets/img/people/ and put the filename in `image`.
#
# Fields:
#   name      required
#   role      required. One of:
#               lead      Lab Lead
#               academic  Academic Staff
#               postdoc   Postdoctoral Researchers
#               phd       PhD Candidates
#               masters   Masters Capstone Students
#               honours   Honours Students
#               student   Students (anyone else, e.g. interns)
#               staff     Professional Staff
#   image     filename in assets/img/people/. Omit for the placeholder.
#   title     job title or degree programme
#   interests short phrase, shown under the name
#   themes    research themes they work on. Feeds the research theme cards.
#             Valid values: immersive-training, health-tech-design,
#                           clinical-workflow, patient-solutions, HCI,
#                           human-robot-interaction, human-ai-interaction
#   email     shown as a mail link
#   website   personal or institutional page
#   scholar   Google Scholar profile URL
#   alumni    true to move them to the alumni section
#   left      what they moved on to, alumni only
#
# Avoid square brackets in plain values. YAML reads them as lists.

- name: Soojeong Yoo
  role: lead
  title: Lecturer in Design
  interests: Immersive systems for surgical training, clinical workflows and patient care
  themes: [immersive-training, health-tech-design, clinical-workflow, patient-solutions]
  email: "soojeong.yoo@sydney.edu.au"
  website: https://profiles.sydney.edu.au/soojeong.yoo

- name: Carlos Alfredo Tirado Cortes
  role: academic
  title: Lecturer in Interaction Design
  image: carlos-tirado-cortes.jpg
