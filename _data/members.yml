# HII Lab members.
#
# To add someone: copy a block, fill it in, drop their photo into
# assets/img/people/ and put the filename in `image`.
#
# Fields:
#   name      required
#   role      required. One of: lead, academic, postdoc, phd, student, staff
#   image     filename in assets/img/people/. Omit for the placeholder.
#   title     job title or degree programme
#   interests short phrase, shown under the name
#   themes    research themes they work on. Feeds the research theme cards.
#             Valid values: immersive-training, health-tech-design,
#                           clinical-workflow, patient-solutions
#   email     shown as a mail link
#   website   personal or institutional page
#   scholar   Google Scholar profile URL
#   alumni    true to move them to the alumni section
#   left      what they moved on to, alumni only
#
# Avoid square brackets in plain values. YAML reads them as lists.

- name: Your Name Here
  role: lead
  title: Lab Director
  interests: Extended reality for clinical training and patient care
  themes: [immersive-training, health-tech-design]
  email: "you@sydney.edu.au"

- name: Example Academic
  role: academic
  title: Senior Lecturer
  interests: Human-centred design of health technology
  themes: [health-tech-design]
  email: "someone@sydney.edu.au"

- name: Example Postdoc
  role: postdoc
  title: Postdoctoral Research Fellow
  interests: Clinical workflow integration
  themes: [clinical-workflow]

- name: Example PhD Candidate
  role: phd
  title: PhD Candidate
  interests: Immersive simulation for surgical training
  themes: [immersive-training]

- name: Example Student
  role: student
  title: Honours Student
  interests: Patient-facing interactive tools
  themes: [patient-solutions]

- name: Example Alumnus
  role: phd
  title: PhD, 2024
  alumni: true
  left: Now a Research Fellow elsewhere