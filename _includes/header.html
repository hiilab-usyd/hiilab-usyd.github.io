<!-- Custom navbar with HII Lab mark -->
<header>
  <nav id="navbar" class="navbar navbar-light navbar-expand-sm fixed-top" role="navigation">
    <div class="container">
      <!-- Navbar brand with logo mark -->
      <a class="navbar-brand" href="/" title="HII Lab Home">
        <img src="/assets/img/hii-lab-mark.png" alt="HII Lab" class="navbar-mark" loading="eager">
      </a>

      <!-- Hamburger menu toggle -->
      <button class="navbar-toggler collapsed navbar-toggler-main" type="button" data-nav-toggle="navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="sr-only">Toggle navigation</span>
        <span class="icon-bar top-bar"></span>
        <span class="icon-bar middle-bar"></span>
        <span class="icon-bar bottom-bar"></span>
      </button>

      <!-- Navbar menu items -->
      <div class="collapse navbar-collapse navbar-collapse-main" id="navbarNav">
        <ul class="navbar-nav navbar-menu-list flex-nowrap">
          <li class="nav-item {% if page.url == '/' %}active{% endif %}">
            <a class="nav-link" href="/">home {% if page.url == '/' %}<span class="sr-only">(current)</span>{% endif %}</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/news/">news</a>
          </li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="navbarResearchDropdown" role="button" data-nav-dropdown-toggle="true" aria-haspopup="true" aria-expanded="false">research</a>
            <div class="dropdown-menu dropdown-menu-right" aria-labelledby="navbarResearchDropdown">
              <a class="dropdown-item" href="/research/themes/">themes</a>
              <a class="dropdown-item" href="/projects/">projects</a>
              <a class="dropdown-item" href="/publications/">publications</a>
            </div>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/team/">team</a>
          </li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="navbarContactDropdown" role="button" data-nav-dropdown-toggle="true" aria-haspopup="true" aria-expanded="false">contact</a>
            <div class="dropdown-menu dropdown-menu-right" aria-labelledby="navbarContactDropdown">
              <a class="dropdown-item" href="/contact/details/">details</a>
              <a class="dropdown-item" href="/contact/join-us/">join us</a>
            </div>
          </li>
          <li class="nav-item">
            <button id="search-toggle" type="button" title="Search" aria-label="Open search">
              <span class="nav-link">ctrl k <i class="fa-solid fa-magnifying-glass"></i></span>
            </button>
          </li>
        </ul>
      </div>
    </div>
  </nav>
  <progress id="progress" value="0">
    <div class="progress-container">
      <span class="progress-bar"></span>
    </div>
  </progress>
</header>
